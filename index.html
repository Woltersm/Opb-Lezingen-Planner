<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Openbare Lezingen</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" id="wrapperThemeColor" content="#0F3250">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    // Direct achtergrondkleur instellen zodat er 0ms overgangsflits is met native Android/iOS
    try {
      document.documentElement.style.backgroundColor = '#0F3250';
      document.documentElement.style.colorScheme = 'dark';
    } catch(e) {}

    // In-App Browser Detectie (Gmail, Outlook, WebView) & Automatisch Chrome forceren op Android
    (function detectAndRedirectInAppBrowser() {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isAndroid = /android/i.test(ua);
      if (!isAndroid) return;

      var isWebView = /;\s*wv\)/i.test(ua) || /\bwv\b/i.test(ua);
      var isMailOrInApp = /FBAN|FBAV|Instagram|LinkedInApp|Line|Twitter|MicroMessenger|GSA|Snapchat/i.test(ua);
      var isChromeVersion = /Version\/[0-9.]+/i.test(ua) && /Chrome\/[0-9.]+/i.test(ua) && !/Chrome\/[0-9.]+ Mobile Safari/i.test(ua);

      if (isWebView || isMailOrInApp || isChromeVersion) {
        var cleanUrl = window.location.host + window.location.pathname + window.location.search + window.location.hash;
        var chromeIntent = 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';

        // 1. Probeer direct automatisch naar de echte Google Chrome app te springen
        try {
          window.location.href = chromeIntent;
        } catch(e) {}

        // 2. Toon de visuele banner als vangnet indien auto-redirect geblokkeerd wordt
        window.addEventListener('DOMContentLoaded', function() {
          var notice = document.getElementById('inAppBrowserNotice');
          var btn = document.getElementById('btnOpenInChrome');
          if (notice) notice.style.display = 'flex';
          if (btn) btn.href = chromeIntent;
        });
      }
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0F3250;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Melding voor In-App Browsers (Gmail, Outlook) op Android */
    .in-app-notice {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .in-app-notice-box {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .in-app-notice-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #D97706;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .in-app-notice-text {
      flex: 1;
      min-width: 0;
    }
    .in-app-notice-title {
      font-size: 12px;
      font-weight: 700;
      color: #F8FAFC;
      line-height: 1.2;
    }
    .in-app-notice-desc {
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.2;
      margin-top: 2px;
    }
    .in-app-notice-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .in-app-chrome-btn {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      background: #0284C7;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
      transition: background 0.15s;
    }
    .in-app-chrome-btn:hover {
      background: #0369A1;
    }
    .in-app-close-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }

    /* Splash Screen Overlay - Exact passend op het native Android/iOS scherm (#0F3250) */
    #pwaSplashScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #0F3250;
      transition: opacity 0.45s ease-out;
      opacity: 1;
      pointer-events: auto;
    }

    /* Exact 50% / 50% centrering van het blauwe PNG icoon */
    .splash-center-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .splash-icon-wrapper {
      position: relative;
      width: 61.6vw;
      max-width: 290px;
      display: inline-block;
      overflow: hidden;
    }

    .splash-native-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.18));
    }

    /* Shimmer Sheen Layer over het PNG-icoon */
    .splash-shimmer-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      -webkit-mask-image: url('icon-512.png');
      mask-image: url('icon-512.png');
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      overflow: hidden;
    }

    .splash-shimmer-sheen::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -60%;
      width: 250%;
      height: 220%;
      background: linear-gradient(
        115deg,
        transparent 0%,
        transparent 38%,
        rgba(255, 255, 255, 0.15) 44%,
        rgba(255, 255, 255, 0.85) 50%,
        rgba(255, 255, 255, 0.15) 56%,
        transparent 62%,
        transparent 100%
      );
      transform: translateX(-120%);
      animation: shimmerSweep 1.85s cubic-bezier(0.45, 0.03, 0.65, 0.2) 0.4s forwards;
      will-change: transform;
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(120%);
      }
    }

    /* Tekst en Slogan: Elegant en vrij ONDER de kalender geplaatst */
    .splash-bottom-slogan {
      position: absolute;
      bottom: max(2.5rem, 7vh);
      left: 0;
      right: 0;
      text-align: center;
      z-index: 20;
      padding: 0 1rem;
      animation: sloganFadeIn 0.35s ease-out forwards;
    }

    @keyframes sloganFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .splash-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin-bottom: 0.35rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    }
    @media (min-width: 640px) {
      .splash-title {
        font-size: 1.45rem;
      }
    }

    .slogan-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
    }

    .slogan-line1 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #BFDBFE;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    @media (min-width: 640px) {
      .slogan-line1 {
        font-size: 1rem;
      }
    }

    .slogan-accent {
      font-size: 1.35rem;
      font-weight: 900;
      color: #38BDF8;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    @media (min-width: 640px) {
      .slogan-accent {
        font-size: 1.55rem;
      }
    }

    .municipality {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-top: 0.6rem;
    }
  </style>
</head>
<body>
  <!-- 3-Seconden Splash Screen (Exact passend op Android/iOS WebAPK screenshot) -->
  <div id="pwaSplashScreen">
    <!-- 1. Het Blauwe Icoon (Exact op 50% verticaal en 50% horizontaal) -->
    <div class="splash-center-icon">
      <div class="splash-icon-wrapper">
        <img src="icon-512.png" alt="Openbare Lezingen Kalender" class="splash-native-img">
        <div class="splash-shimmer-sheen"></div>
      </div>
    </div>

    <!-- 2. De Tekst & Slogan: Zindelijk en ruim ONDER het icoon -->
    <div class="splash-bottom-slogan">
      <h1 class="splash-title">Openbare Lezingen</h1>
      <div class="slogan-box">
        <p class="slogan-line1">Zoek, Selecteer</p>
        <p class="slogan-accent">&amp; Plan</p>
      </div>
      <p class="municipality">Het Gooi Noord</p>
    </div>
  </div>

  <!-- Melding voor In-App Browsers (Gmail, Outlook) op Android -->
  <div id="inAppBrowserNotice" class="in-app-notice" style="display: none;">
    <div class="in-app-notice-box">
      <div class="in-app-notice-icon">
        <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <div class="in-app-notice-text">
        <div class="in-app-notice-title">Geopend in e-mailviewer</div>
        <p class="in-app-notice-desc">Voor direct inloggen en installeren als app:</p>
      </div>
      <div class="in-app-notice-actions">
        <a id="btnOpenInChrome" href="#" class="in-app-chrome-btn">
          <span>Open in Chrome</span>
        </a>
        <button type="button" onclick="document.getElementById('inAppBrowserNotice').style.display='none'" class="in-app-close-btn">&times;</button>
      </div>
    </div>
  </div>

  <iframe id="appFrame" allow="fullscreen"></iframe>
  <script>
    (function initAppFrameSrc() {
      var baseAppUrl = "https://script.google.com/macros/s/AKfycbwFVihPtRINd254W2VzhzHednnbVlWiL_MAo1HnzG7CutgahsfQif_5ph_Noky-C8UgFg/exec";
      var search = window.location.search || "";
      if (!search && window.location.hash && window.location.hash.indexOf("?") !== -1) {
        search = window.location.hash.substring(window.location.hash.indexOf("?"));
      }
      var frame = document.getElementById("appFrame");
      if (frame) frame.src = baseAppUrl + search;
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Verwijder splash screen vloeiend na 3000ms
    const splash = document.getElementById('pwaSplashScreen');
    setTimeout(() => {
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(() => {
          splash.remove();
        }, 460);
      }
    }, 3000);

    // PWA Installatie opvangen en doorgeven aan de Apps Script iframe
    let deferredPwaPrompt = null;

    function isTopStandalone() {
      try {
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.navigator && window.navigator.standalone === true) return true;
        if (document.referrer && document.referrer.includes('android-app://')) return true;
      } catch(e) {}
      return false;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPwaPrompt = e;
      notifyIframePwaStatus();
    });

    window.addEventListener('appinstalled', () => {
      deferredPwaPrompt = null;
      notifyIframe({ type: 'pwaInstalled' });
    });

    function notifyIframe(data) {
      const frame = document.getElementById('appFrame');
      if (frame && frame.contentWindow) {
        try { frame.contentWindow.postMessage(data, '*'); } catch(e) {}
      }
      for (let i = 0; i < window.frames.length; i++) {
        try {
          window.frames[i].postMessage(data, '*');
          for (let j = 0; j < window.frames[i].frames.length; j++) {
            try { window.frames[i].frames[j].postMessage(data, '*'); } catch(e2) {}
          }
        } catch(e) {}
      }
    }

    function notifyIframePwaStatus(target) {
      const msg = {
        type: 'pwaInstallStatus',
        available: Boolean(deferredPwaPrompt),
        isStandalone: isTopStandalone(),
        urlSearch: window.location.search || ''
      };
      if (target) {
        try { target.postMessage(msg, '*'); } catch(e) {}
      }
      notifyIframe(msg);
    }

    // Luister naar themakleur-wijzigingen, installatieverzoeken en afsluitberichten vanuit de Apps Script iframe
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.themeColor) {
        document.getElementById('wrapperThemeColor').setAttribute('content', event.data.themeColor);
        document.documentElement.style.backgroundColor = event.data.themeColor;
        document.body.style.backgroundColor = event.data.themeColor;
      }
      if (event.data.type === 'appReady' || event.data.action === 'checkPwaInstall') {
        notifyIframePwaStatus(event.source);
      }
      if (event.data.action === 'triggerPwaInstall') {
        if (deferredPwaPrompt) {
          try {
            deferredPwaPrompt.prompt();
            deferredPwaPrompt.userChoice.then((choiceResult) => {
              const reply = {
                type: 'pwaInstallResult',
                outcome: choiceResult.outcome
              };
              if (event.source) {
                try { event.source.postMessage(reply, '*'); } catch(e) {}
              }
              notifyIframe(reply);
              deferredPwaPrompt = null;
            }).catch(() => {
              const reply = { type: 'pwaInstallUnavailable' };
              if (event.source) {
                try { event.source.postMessage(reply, '*'); } catch(e) {}
              }
              notifyIframe(reply);
            });
          } catch(err) {
            const reply = { type: 'pwaInstallUnavailable' };
            if (event.source) {
              try { event.source.postMessage(reply, '*'); } catch(e) {}
            }
            notifyIframe(reply);
          }
        } else {
          const reply = { type: 'pwaInstallUnavailable' };
          if (event.source) {
            try { event.source.postMessage(reply, '*'); } catch(e) {}
          }
          notifyIframe(reply);
        }
      }
      if (event.data.action === 'exitApp') {
        try { window.close(); } catch(e) {}
        try { window.history.back(); } catch(e) {}
      }
    });
  </script>
</body>
</html>
